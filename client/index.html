<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nori — Order to your macros</title>
    <script>
      // Set the theme class before first paint to avoid a flash. Light is
      // the default; dark only when the user has toggled it themselves.
      try {
        if (localStorage.getItem("nori_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
